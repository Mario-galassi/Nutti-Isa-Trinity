<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutti Trinity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>:root{
  --cream:#FFF6E9; --cream2:#FBEBD3; --card:#FFFDF8; --choco:#4A2E17; --choco2:#6B4423; --caramel:#C7792E; --hazel:#9A6334;
  --ok:#3E9B57; --okbg:#E3F4E6; --bad:#D2553F; --badbg:#FBE4DE; --hl:#FFE08A; --sky:#7FB7D9; --line:#E8D6BC;
  --s1:#F6C453; --s2:#E98A5B; --s3:#7DB8A5; --s4:#9C8BD8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--choco);font-family:'Nunito',system-ui,sans-serif;font-size:18px;line-height:1.4}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,#FFF9F0 0,var(--cream) 50%),var(--cream)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
h1,h2,h3,.fred{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;margin:0}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 40px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,246,233,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.hbar{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--cream2);border:3px solid var(--caramel);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.htitle{flex:1;min-width:0}
.htitle h1{font-size:22px;line-height:1.1}
.htitle small{color:var(--hazel);font-weight:700;font-size:13px}
.nuts{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:18px;white-space:nowrap}
.nuts.pop{animation:pop .5s}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:20px;display:grid;place-items:center;flex:none}
@keyframes pop{40%{transform:scale(1.25)}}

/* Nutti bubble */
.say{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
.say .avatar{width:58px;height:58px}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;flex:1;box-shadow:0 3px 0 var(--line)}
.bubble:before{content:'';position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:var(--line)}
.bubble.ok{background:var(--okbg);border-color:#A9D8B3}
.bubble.bad{background:#FFF1EC;border-color:#F0B9A9}
.bubble.hint{background:#FFF7DA;border-color:#EBD38A}
.bubble b{color:var(--choco2)}

/* cards & grid */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line);margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mod{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line);display:flex;gap:12px;align-items:center;min-height:86px;transition:transform .1s}
.mod:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mod .ico{font-size:34px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.mod h3{font-size:18px}
.mod p{margin:2px 0 0;font-size:14px;color:var(--hazel)}
.mod .tag{position:absolute;top:-9px;right:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px}
.focus{background:linear-gradient(135deg,#FFF3CF,#FFE7D0);border-color:#EFC98B}
.focus ul{margin:6px 0 0;padding-left:20px}
.pill{display:inline-block;background:var(--cream2);border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;margin:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700;font-size:15px}
.chip.on{background:var(--choco2);color:#fff;border-color:var(--choco2)}
.lbl{font-size:13px;font-weight:800;color:var(--hazel);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:16px;padding:12px 18px;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;font-size:19px;background:var(--caramel);color:#fff;box-shadow:0 4px 0 #8E5320;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8E5320}
.btn.soft{background:var(--card);color:var(--choco);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #2A6E3C}
.btn.small{font-size:16px;padding:8px 12px;border-radius:12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.spacer{flex:1}

/* progress */
.prog{display:flex;gap:6px;justify-content:center;margin:10px 0}
.prog i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.prog i.ok{background:var(--ok)}.prog i.meh{background:var(--s1)}.prog i.cur{background:var(--caramel);transform:scale(1.25)}

/* question prompt */
.prompt{font-family:'Fredoka',system-ui,sans-serif;font-size:22px;font-weight:500;text-align:center;margin:6px 0}
.prompt .es{display:block;font-size:16px;font-family:'Nunito';color:var(--hazel);font-weight:700}
.big{font-size:28px}
.en{font-family:'Fredoka',system-ui,sans-serif;font-weight:500}

/* tiles */
.sandwich{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
.sandwich span{font-size:13px;font-weight:800;border-radius:10px;padding:3px 8px}
.slot{min-height:72px;border:3px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#FFFBF3;margin:10px 0}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.bad{animation:shake .4s}
.slot .ph{color:#C6B49A;font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px;margin:6px 0 12px}
.tile{font-family:'Fredoka',system-ui,sans-serif;font-weight:500;font-size:22px;background:#fff;border:2px solid var(--choco2);border-radius:14px;padding:8px 14px;box-shadow:0 4px 0 var(--choco2);transition:transform .08s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--choco2)}
.tile.used{visibility:hidden}
.tile.good{border-color:var(--ok);box-shadow:0 4px 0 var(--ok);background:var(--okbg)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* options */
.opts{display:grid;gap:10px;margin:12px 0}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;font-size:20px;font-family:'Fredoka',system-ui,sans-serif;font-weight:500;box-shadow:0 4px 0 var(--line);text-align:center;transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);opacity:.8}
.opt.dim{opacity:.5}
.opt small{display:block;font-family:'Nunito';font-size:14px;color:var(--hazel)}
.answer-card{background:#fff;border:2px dashed var(--caramel);border-radius:16px;padding:14px;text-align:center;font-size:22px}
mark{background:var(--hl);border-radius:6px;padding:0 4px;color:inherit}

/* svg things */
.svgbox{display:flex;justify-content:center}
.svgbox svg{width:100%;max-width:420px;height:auto}
.clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.clocks .opt{padding:6px}
.bld{cursor:pointer}
.bld rect{transition:fill .2s}
.bld:hover rect{fill:#FFE3B8}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:1/1.05;border-radius:16px;position:relative;font-family:'Fredoka',system-ui,sans-serif;font-weight:500;font-size:17px;transition:transform .18s ease-in}
.mc .face{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:6px;text-align:center;line-height:1.15}
.mc .back{background:linear-gradient(135deg,var(--caramel),var(--hazel));color:#fff;font-size:30px;box-shadow:0 4px 0 #7A4A20}
.mc .front{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:none}
.mc.open .front{display:grid}.mc.open .back{display:none}
.mc.done .front{background:var(--okbg);border-color:var(--ok)}
.mc.flip{transform:scaleX(0)}

/* flashcards */
.fc{min-height:220px;border-radius:24px;background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:transform .16s ease-in;cursor:pointer;width:100%}
.fc.flip{transform:scaleX(0)}
.fc .big{font-family:'Fredoka'}
.fc .note{margin-top:10px;color:var(--hazel);font-size:16px}

/* exam */
.examq{font-family:'Fredoka',system-ui,sans-serif;font-size:26px;text-align:center;padding:10px}
.blur{filter:blur(9px);user-select:none}
.mic{width:96px;height:96px;border-radius:50%;background:var(--bad);color:#fff;font-size:42px;box-shadow:0 5px 0 #8f3324}
.mic.rec{animation:pulse 1s infinite}
.transcript{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-style:italic;min-height:44px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(74,46,23,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 30px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
select,input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--choco);width:100%}
table.stats{width:100%;border-collapse:collapse;font-size:15px}
table.stats td{padding:6px 4px;border-bottom:1px solid var(--line)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}

/* confetti */
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.fade{animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.center{text-align:center}
.muted{color:var(--hazel);font-size:15px}
</style>
</head>

  <div class="htitle"><h1>Nutti · Trinity</h1><small id="sub">Preparación Trinity · Grade 3</small></div>
  <span class="nuts" id="nuts">🌰 0</span>
  <button class="iconbtn" onclick="A.settings()" aria-label="Ajustes">⚙️</button>
</div></header>
<main class="wrap" id="main"></main>

    }
    for (var i = 0; i < 60; i++) { var a = i * 6 * Math.PI / 180, r1 = i % 5 ? 84 : 78; s += '<line x1="' + (100 + r1 * Math.sin(a)) + '" y1="' + (100 - r1 * Math.cos(a)) + '" x2="' + (100 + 89 * Math.sin(a)) + '" y2="' + (100 - 89 * Math.cos(a)) + '" stroke="#9A6334" stroke-width="' + (i % 5 ? 1.2 : 3) + '"/>'; }

    s += '<line x1="100" y1="100" x2="' + (100 + 74 * Math.sin(ma)) + '" y2="' + (100 - 74 * Math.cos(ma)) + '" stroke="#C7792E" stroke-width="6" stroke-linecap="round"/>';

    M = { cards: NT.shuffle(cards), open: [], done: 0, moves: 0, lock: false, pairs: pairs };
    render(chips(Object.keys(NT.DECKS).map(function (k) { return [k, NT.DECKS[k].ico + ' ' + NT.DECKS[k].name]; }), memDeck, 'memDeck') +
      '<div id="say">' + nutti('Tocá dos cartas: si son pareja, ¡quedan dadas vuelta! 🧠 <span class="muted" id="moves">Jugadas: 0</span>') + '</div>' +
      '<div class="mem">' + M.cards.map(function (c, i) { return '<button class="mc" id="m' + i + '" onclick="A.mFlip(' + i + ')"><span class="face back">🌰</span><span class="face front">' + esc(c.t) + '</span></button>'; }).join('') + '</div>');
  }
  function mFlip(i) {
    var c = M.cards[i], el = $('m' + i);
    if (M.lock || c.open || c.done) return;
    flipAnim(el, true); c.open = true; M.open.push(i);
    if (/^[a-z]/i.test(c.t) && c.en) speak(c.t);
    if (M.open.length === 2) {
      M.moves++; $('moves').textContent = 'Jugadas: ' + M.moves;
      var a = M.cards[M.open[0]], b = M.cards[M.open[1]];
      if (a.k === b.k) {
        a.done = b.done = true; M.done++;
        [M.open[0], M.open[1]].forEach(function (j) { $('m' + j).classList.add('done'); });
        M.open = []; stat('memory', true);
        if (M.done === M.pairs.length) {
          var n = M.moves <= 9 ? 3 : M.moves <= 13 ? 2 : 1; addNuts(n); confetti(80);
          setSay('<b>¡Encontraste todas, ' + nick() + '!</b> En ' + M.moves + ' jugadas. +' + n + ' 🌰<div class="row" style="margin-top:8px"><button class="btn small" onclick="A.memoryScreen()">🔁 Otra vez</button></div>', 'ok');
        }
      } else {
        M.lock = true; stat('memory', false);
        setTimeout(function () { M.open.forEach(function (j) { M.cards[j].open = false; flipAnim($('m' + j), false); }); M.open = []; M.lock = false; }, 1100);
      }
    }
  }
  function flipAnim(el, open) { el.classList.add('flip'); setTimeout(function () { el.classList.toggle('open', open); el.classList.remove('flip'); }, 170); }

  /* =========================================================
     TARJETAS
     ========================================================= */
  var cDeck = 'qwords', cIdx = 0, cBack = false;
  function cardsScreen(deck) {
    cur = 'cards'; if (deck && deck !== cDeck) { cDeck = deck; cIdx = 0; } cBack = false; setHeader('🃏 Tarjetas');
    var d = NT.CARDS[cDeck], c = d.list[cIdx], kk = cDeck + ':' + cIdx, nk = d.list.filter(function (x, i) { return known[cDeck + ':' + i]; }).length;
    render(chips(Object.keys(NT.CARDS).map(function (k) { return [k, NT.CARDS[k].ico + ' ' + NT.CARDS[k].name]; }), cDeck, 'cardsScreen') +
      '<p class="muted center">Tarjeta ' + (cIdx + 1) + ' de ' + d.list.length + ' · ya sabés ' + nk + ' ✅</p>' +
      '<button class="fc" id="fc" onclick="A.cFlip()"><div id="fcin">' + cardFace(c, false) + '</div></button>' +
      '<div class="row c" style="margin-top:14px"><button class="btn soft" onclick="A.cMove(-1)">⬅️</button><button class="btn soft" onclick="A.say(' + reg(c.en.replace(' → ', ', ')) + ')">🔊</button><button class="btn ' + (known[kk] ? 'green' : 'soft') + '" onclick="A.cKnow()">' + (known[kk] ? '✅ ¡La sé!' : '☑️ La sé') + '</button><button class="btn soft" onclick="A.cMove(1)">➡️</button></div>' +
      nutti('Leé la tarjeta en voz alta, pensá qué significa y tocala para darla vuelta 🔄'));
    setTimeout(function () { speak(c.en.replace(' → ', ', ')); }, 200);
  }
  function cardFace(c, back) { return back ? '<div class="big fred">' + esc(c.es) + '</div>' + (c.note ? '<div class="note">' + esc(c.note) + '</div>' : '') : '<div class="big fred">' + esc(c.en) + '</div><div class="note">Tocá para ver 🔄</div>'; }
  function cFlip() { var el = $('fc'); el.classList.add('flip'); setTimeout(function () { cBack = !cBack; $('fcin').innerHTML = cardFace(NT.CARDS[cDeck].list[cIdx], cBack); el.classList.remove('flip'); }, 160); }
  function cMove(d) { var L = NT.CARDS[cDeck].list.length; cIdx = (cIdx + d + L) % L; cardsScreen(); }
  function cKnow() { var kk = cDeck + ':' + cIdx; if (known[kk]) delete known[kk]; else { known[kk] = 1; addNuts(0); } save('known', known); cardsScreen(); }

  /* =========================================================
     SIMULACRO TRINITY
     ========================================================= */
  var X = null, SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
  function examScreen() {
    cur = 'exam'; setHeader('🎤 Simulacro Trinity'); againFn = examScreen;
    render(nutti('¡Hoy yo soy el examinador, ' + nick() + '! 🎤<br>1️⃣ Te voy a hacer preguntas <b>en inglés</b> de dos temas. Escuchá y contestá <b>en voz alta</b>, con oraciones completas.<br>2️⃣ Al final, <b>vos me hacés preguntas a mí</b> (¡en el examen también pasa!).<br>Si no entendés, podés decir: <i>“Sorry, can you repeat that, please?”</i>') +
      '<div class="card center"><p class="lbl">Temas del examen</p><div class="chips" style="justify-content:center">' + Object.keys(NT.EXAM).map(function (k) { return '<span class="pill">' + NT.TOPICS[k].ico + ' ' + NT.TOPICS[k].name + '</span>'; }).join('') + '</div>' +
      '<p class="muted">' + (SR ? '🎙️ Podés usar el micrófono para ver lo que dijiste.' : 'Este navegador no tiene micrófono para Nutti, pero igual podés contestar en voz alta 🗣️') + '</p>' +
      '<button class="btn green" onclick="A.examStart()">🎤 ¡Empezar!</button></div>');
  }
  function examStart() {
    var tps = NT.shuffle(Object.keys(NT.EXAM)).slice(0, 2), qs = [];
    tps.forEach(function (tp) { NT.shuffle(NT.EXAM[tp]).slice(0, 3).forEach(function (q) { qs.push({ tp: tp, q: q[0], st: q[1] }); }); });
    var asks = NT.shuffle(NT.Q).slice(0, 2);
    X = { qs: qs, i: 0, asks: asks, ai: 0, said: 0, full: 0 };
    examQ();
  }
  function examQ() {
    if (X.i >= X.qs.length) return examAsk();
    var q = X.qs[X.i], tp = NT.TOPICS[q.tp];
    X.reveal = false; X.answered = false;
    render('<div class="prog">' + X.qs.map(function (_, k) { return '<i class="' + (k < X.i ? 'ok' : k === X.i ? 'cur' : '') + '"></i>'; }).join('') + '<i></i><i></i></div>' +
      '<div class="card center"><span class="pill">' + tp.ico + ' ' + tp.name + '</span><div id="eq" class="examq blur">' + esc(q.q) + '</div>' +
      '<div class="row c"><button class="btn" onclick="A.say(' + reg(q.q) + ',0.85)">🔊 Escuchar</button><button class="btn soft small" onclick="A.examRepeat()">🔁 “Sorry, can you repeat that, please?”</button><button class="btn soft small" onclick="A.examReveal()">👀 Ver la pregunta</button></div></div>' +
      '<div id="say">' + nutti('Escuchá la pregunta y contestá en voz alta 🗣️. ¡Tratá de decir una oración completa!') + '</div>' +
      '<div class="card center">' + (SR ? '<button class="mic" id="mic" onclick="A.listen()">🎙️</button><p class="muted">Tocá el micrófono y hablá</p><div class="transcript" id="tr">…</div>' : '') +
      '<div class="row c" style="margin-top:12px"><button class="btn soft small" onclick="A.examStarter()">💡 Ayuda para empezar</button><button class="btn green" onclick="A.examNext()">✅ Ya contesté</button></div></div>');
    setTimeout(function () { speak(q.q, 0.85); }, 400);
  }
  function examRepeat() { setSay('¡Muy bien pedido! 👏 Esa frase sirve en el examen. Escuchá otra vez, más despacito…', 'ok'); speak('Of course. ' + X.qs[X.i].q, 0.75); }
  function examReveal() { $('eq').classList.remove('blur'); X.reveal = true; }
  function examStarter() { var q = X.qs[X.i]; setSay('Podés empezar así: <span class="en">“' + esc(q.st) + '”</span> y lo completás con <b>tu</b> información 🙂', 'hint'); }
  function listen() {
    if (!SR) return;
    try {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = 'en-GB'; rec.interimResults = true; rec.maxAlternatives = 1;
      var m = $('mic'); m.classList.add('rec'); $('tr').textContent = '🎧 Escuchando…';
      var finalTxt = '';
      rec.onresult = function (e) { var txt = ''; for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript; finalTxt = txt; $('tr').textContent = '“' + txt + '”'; };
      rec.onerror = function () { $('tr').textContent = 'No te pude escuchar bien 🙉 Probá de nuevo, o contestá en voz alta y tocá “Ya contesté”.'; };
      rec.onend = function () { m.classList.remove('rec'); rec = null; if (finalTxt) examFeedback(finalTxt); };
      rec.start();
    } catch (e) { rec = null; }
  }
  function examFeedback(txt) {
    var q = X.qs[X.i], words = txt.trim().split(/\s+/).length, past = /\b(did|was|were|yesterday|last)\b/i.test(q.q);
    var msg = '';
    if (words >= 4) { msg = '¡Oración completa! 👏 '; X.full++; } else msg = 'Fue cortita. En el Trinity suma mucho decir una <b>oración completa</b> y agregar algo más (and…, because…) 💪 ';
    if (past && !NT.PAST_WORDS.test(txt)) msg += '<br>Ojo: la pregunta es en <b>pasado</b> ⏪. ¿Usaste un verbo en pasado (went, played, was…)?';
    else if (past) msg += '<br>¡Y usaste el pasado! ⏪✔️';
    setSay(msg, words >= 4 ? 'ok' : 'hint');
  }
  function examNext() { X.said++; addNuts(1); X.i++; examQ(); }
  function examAsk() {
    if (X.ai >= X.asks.length) return examEnd();
    var it = X.asks[X.ai], tk = it.q.split(' ');
    var task = { item: it, answer: tk, tiles: NT.shuffle(tk.map(function (w, k) { return { w: w, id: 'w' + k, ok: true }; })) };
    R = null;
    render('<div class="card center"><h2>🔄 Your turn!</h2><p class="muted">Ahora vos sos la examinadora. Pregunta ' + (X.ai + 1) + ' de ' + X.asks.length + '</p></div>' +
      '<div id="say">' + nutti('Armala con las fichas y después decila en voz alta 🗣️') + '</div>' + builderHTML(task, '<p class="prompt">🎯 Preguntale a Nutti <b>' + esc(it.es) + '</b>.</p>') + '<div class="row c"><button id="nextbtn" class="btn green" style="display:none" onclick="A.examAskNext()">Siguiente ➜</button></div>');
    B.onSolve = function () { addNuts(1); confetti(40); setSay('¡Muy bien preguntado! 🎉 Decila en voz alta vos también. Mi respuesta: <span class="en">“' + esc(it.a) + '”</span> ' + spk(it.a), 'ok'); $('nextbtn').style.display = ''; stat('exam', true); };
  }
  function examAskNext() { X.ai++; examAsk(); }
  function examEnd() {
    addNuts(2); confetti(100);
    render('<div class="card center fade"><h2 class="big">🏆 ¡Terminaste el simulacro!</h2><p class="prompt">Contestaste ' + X.said + ' preguntas e hiciste ' + X.asks.length + ' preguntas</p><p>+2 🌰 de premio</p></div>' +
      nutti('<b>Truquitos para el día del examen:</b><br>✔️ Contestá con oraciones completas: no solo “Yes”, sino “Yes, I do. I play on Saturdays.”<br>✔️ Agregá algo más con <b>and</b> o <b>because</b>.<br>✔️ Si no entendés, decí <i>“Sorry, can you repeat that, please?”</i><br>✔️ ¡Acordate de hacerle preguntas al examinador! 🧩', 'ok') +
      '<div class="row c"><button class="btn" onclick="A.examScreen()">🔁 Otro simulacro</button><button class="btn soft" onclick="A.go(\'home\')">🏠 Inicio</button></div>');
  }

  /* =========================================================
     ZONA ADULTOS
     ========================================================= */
  var CH = null;
  var AREAS = { build: '🧩 Armar preguntas', pastq: '🧩 Preguntas en pasado', detective: '🕵️ Detective', errors: '🔍 Cazá el error', clock: '🕐 Reloj', date: '📅 Fechas', day: '📆 Ayer/mañana', prepT: '🧱 in/on/at', follow: '👣 Seguir camino', explain: '🗣️ Explicar camino', street: '🏘️ next to/opposite', past: '⏪ Verbos pasado', be: '🪞 was/were', memory: '🧠 Memoria', exam: '🎤 Simulacro' };
  function settings() {
    CH = NT.adultChallenge();
    var vo = voices.map(function (v, i) { return '<option value="' + i + '"' + (voice && v.name === voice.name ? ' selected' : '') + '>' + esc(v.name) + ' (' + v.lang + ')</option>'; }).join('');
    var rows = Object.keys(AREAS).filter(function (k) { return stats[k]; }).map(function (k) { var s = stats[k], p = Math.round(100 * s.ok / s.n); return '<tr><td>' + AREAS[k] + '</td><td style="width:40%"><div class="bar"><i style="width:' + p + '%;background:' + (p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--s1)' : 'var(--bad)') + '"></i></div></td><td>' + p + '%</td><td class="muted">' + s.n + '</td></tr>'; }).join('');
    var m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
    m.onclick = function (e) { if (e.target === m) closeModal(); };
    m.innerHTML = '<div class="sheet"><div class="row"><h2>⚙️ Ajustes</h2><span class="spacer"></span><button class="iconbtn" onclick="A.closeModal()">✖️</button></div>' +
      '<p class="lbl">Voz de Nutti (inglés)</p>' + (voices.length ? '<select id="vsel" onchange="A.setVoice(this.value)">' + vo + '</select><div class="row" style="margin-top:8px"><button class="btn soft small" onclick="A.say(\'Hello Isa! Where do you live?\')">🔊 Probar voz</button></div>' : '<p class="muted">Este navegador no tiene voces en inglés.</p>') +
      '<p class="lbl" style="margin-top:18px">📊 Progreso (para mamá y papá)</p>' + (rows ? '<table class="stats"><tr class="muted"><td>Actividad</td><td>Aciertos</td><td>%</td><td>Intentos</td></tr>' + rows + '</table>' : '<p class="muted">Todavía no hay datos.</p>') +
      '<p class="lbl" style="margin-top:18px">🔒 Zona de adultos: borrar todo el progreso</p><p class="muted">¿Cuánto es ' + CH.a + ' × ' + CH.b + '?</p><div class="row"><input id="ach" type="number" inputmode="numeric" style="width:120px"><button class="btn soft small" onclick="A.reset1()">Borrar</button></div><div id="rs"></div></div>';
    document.body.appendChild(m);
  }
  function closeModal() { var m = $('modal'); if (m) m.remove(); }
  function setVoice(i) { voice = voices[+i]; try { localStorage.setItem(VOICE_KEY, voice.name); } catch (e) { } speak('Hello ' + nick() + '!'); }
  function reset1() {
    if (+$('ach').value !== CH.ans) { $('rs').innerHTML = '<p style="color:var(--bad)">Respuesta incorrecta.</p>'; return; }
    $('rs').innerHTML = '<p><b>¿Seguro?</b> Se borran las avellanas y el progreso.</p><button class="btn small" style="background:var(--bad)" onclick="A.reset2()">Sí, estoy seguro</button>';
  }
  function reset2() { $('rs').innerHTML = '<p><b>Última confirmación.</b> No se puede deshacer.</p><button class="btn small" style="background:var(--bad)" onclick="A.reset3()">Borrar definitivamente</button>'; }
  function reset3() { nuts = 0; stats = {}; known = {}; save('nuts', 0); save('stats', {}); save('known', {}); closeModal(); $('nuts').textContent = '🌰 0'; go('home'); }

  /* ---------- navegación ---------- */
  function go(s) {
    try { speechSynthesis.cancel(); } catch (e) { }
    if (rec) try { rec.stop(); } catch (e) { }
    cur = s; R = null;
    var map = { home: home, build: function () { bOpts.rules = null; bOpts.top = ''; buildScreen(); }, detective: detectiveScreen, errors: errorsScreen, time: function () { timeScreen(); }, dirs: function () { dirsScreen(); }, past: function () { pastScreen(); }, memory: function () { memoryScreen(); }, cards: function () { cardsScreen(); }, exam: examScreen };
    setHeader(); (map[s] || home)();
  }
  function init() {
    $('nuts').textContent = '🌰 ' + nuts;
    document.querySelectorAll('.avimg').forEach(function (i) { i.src = IMG; });
    go('home');
  }

  return {
    _st: function () { return { R: R, B: B, M: M, X: X, MAP: MAP, cur: cur }; },
    init: init, go: go, next: next, again: function () { againFn ? againFn() : go('home'); },
    say: function (i, r) { speak(typeof i === 'number' ? REG[i] : i, r); },
    tap: tap, untap: untap, undo: undo, clearB: clearB, hint: hint, check: check, setTopic: setTopic, setTrap: setTrap,
    detPick: detPick, detHint: detHint, errPick: errPick,
    timeMode: timeMode, clockLvl: clockLvl, tHint: tHint, tPick: tPick,
    dirsMode: dirsMode, dHint: dHint, mapTap: mapTap, dPick: dPick,
    pastMode: pastMode, pHint: pHint, pPick: pPick,
    memoryScreen: memoryScreen, memDeck: function (d) { memoryScreen(d); }, mFlip: mFlip,
    cardsScreen: cardsScreen, cFlip: cFlip, cMove: cMove, cKnow: cKnow,
    examScreen: examScreen, examStart: examStart, examRepeat: examRepeat, examReveal: examReveal, examStarter: examStarter, listen: listen, examNext: examNext, examAskNext: examAskNext,
    settings: settings, closeModal: closeModal, setVoice: setVoice, reset1: reset1, reset2: reset2, reset3: reset3
  };
})();
</script>
<script>A.init();</script>
</body>
</html>
